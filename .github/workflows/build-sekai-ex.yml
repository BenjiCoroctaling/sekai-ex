name: Build SEKAI EX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/build-sekai-ex.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --locked
      - name: Build engine
        run: uv run sonolus-py build
      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekai-ex-engine
          path: engine/build/dist/
          if-no-files-found: error
